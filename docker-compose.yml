services:
  vxctech-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: vxctech-website:latest
    container_name: vxctech-website
    ports:
      - "8080:8080"
    environment:
      # SSL/TLS is terminated by Nginx or the external load balancer, not here.
      - CATALINA_OPTS=-Xms128m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
